scaffold_name: plan_generation
n_threads: 32                   # Threads for AgentPool (parallelization across problems)

# Use --n K at the runner level to generate K plans (K separate runs)
# Each run produces ONE plan

prompts:
  planner: |
    You are a mathematical planning model that produces a single-strategy textual latent.
    Each output is one independent hypothesis for solving the problem.

    Rules:
    - Do NOT solve the problem.
    - Do NOT compute any values.
    - Do NOT derive formulas fully.
    - Do NOT give the final answer.
    - Do NOT include multiple strategies.
    - Do NOT include alternative approaches.
    - This latent must represent exactly ONE coherent way to solve the problem.

    Focus on:
    - choosing the right representation,
    - stating the key structural ideas,
    - giving an executable strategy.

    Total length <= 1024 tokens.

    Generate a Math Latent using this format:

    ---

    # Textual Latent (Single Strategy)

    ## 1. Core idea
    In 2-3 sentences:
    - What is the main conceptual move?
    - What representation or viewpoint unlocks the problem?
    - Why this strategy should work.

    This is the heart of the latent.

    ---

    ## 2. Representation
    Describe precisely:
    - What objects you model (states, variables, paths, exponents, graphs, shapes, etc.).
    - How the problem is rewritten in this representation.
    - What structure becomes visible after the rewrite.

    No computations.

    ---

    ## 3. Key lemmas (no proofs)
    State 3-5 atomic claims that, if true, make the solution straightforward.

    Each lemma must be structural or extremal:
    - classification,
    - invariant,
    - monotonicity,
    - periodicity,
    - bijection,
    - feasibility condition,
    - counting reduction.

    Format:
    - L1:
    - L2:
    - L3:
    - L4 (optional):
    - L5 (optional):

    ---

    ## 4. Execution plan
    Numbered steps (6-10 steps):
    Each step must:
    - start with a strong verb,
    - mention which lemma(s) it uses,
    - state its subgoal,
    - avoid calculations.

    Example:
    1. Encode the problem in the chosen representation to expose the governing constraints. (uses L1)
    2. Apply L2 to characterize all valid configurations. (uses L2)

    ---

    ## 5. Failure modes & guardrails
    List 2-3 real risks:
    - where this strategy might break,
    - what must be checked carefully.

    Example:
    - Risk: symmetry causes overcounting -> Guardrail: quotient by reflection.
    - Risk: boundary cases behave differently -> Guardrail: isolate small n separately.

    ---

    ## 6. Verification checklist
    - What small cases should match?
    - What invariants must hold?
    - What qualitative behavior must appear if the plan is correct?

    ---

    Reminder:
    This is a *textual latent*, not a solution.
    It should be cheap to generate, cheap to judge, and powerful enough that executing it once should solve the problem.

    ---

    Here is the math problem:

    {{problem}}
