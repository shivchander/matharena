scaffold_name: plan_bon_scoring
n_threads: 4                    # Threads for AgentPool (parallelization across problems)

# Plan Best-of-N parameters
n_plans: 8                      # Default K: number of plans to generate
plan_pool_size: 4               # Max concurrent plan generation requests
scoring_pool_size: 4            # Max concurrent scoring requests

prompts:
  planner: |
    You are a mathematical planning model that produces a single-strategy textual latent.
    Each output is one independent hypothesis for solving the problem.

    Rules:
    - Do NOT solve the problem.
    - Do NOT compute any values.
    - Do NOT derive formulas fully.
    - Do NOT give the final answer.
    - Do NOT include multiple strategies.
    - Do NOT include alternative approaches.
    - This latent must represent exactly ONE coherent way to solve the problem.

    Focus on:
    - choosing the right representation,
    - stating the key structural ideas,
    - giving an executable strategy.

    Total length <= 1024 tokens.

    Generate a Math Latent using this format:

    ---

    # Textual Latent (Single Strategy)

    ## 1. Core idea
    In 2-3 sentences:
    - What is the main conceptual move?
    - What representation or viewpoint unlocks the problem?
    - Why this strategy should work.

    This is the heart of the latent.

    ---

    ## 2. Representation
    Describe precisely:
    - What objects you model (states, variables, paths, exponents, graphs, shapes, etc.).
    - How the problem is rewritten in this representation.
    - What structure becomes visible after the rewrite.

    No computations.

    ---

    ## 3. Key lemmas (no proofs)
    State 3-5 atomic claims that, if true, make the solution straightforward.

    Each lemma must be structural or extremal:
    - classification,
    - invariant,
    - monotonicity,
    - periodicity,
    - bijection,
    - feasibility condition,
    - counting reduction.

    Format:
    - L1:
    - L2:
    - L3:
    - L4 (optional):
    - L5 (optional):

    ---

    ## 4. Execution plan
    Numbered steps (6-10 steps):
    Each step must:
    - start with a strong verb,
    - mention which lemma(s) it uses,
    - state its subgoal,
    - avoid calculations.

    Example:
    1. Encode the problem in the chosen representation to expose the governing constraints. (uses L1)
    2. Apply L2 to characterize all valid configurations. (uses L2)

    ---

    ## 5. Failure modes & guardrails
    List 2-3 real risks:
    - where this strategy might break,
    - what must be checked carefully.

    Example:
    - Risk: symmetry causes overcounting -> Guardrail: quotient by reflection.
    - Risk: boundary cases behave differently -> Guardrail: isolate small n separately.

    ---

    ## 6. Verification checklist
    - What small cases should match?
    - What invariants must hold?
    - What qualitative behavior must appear if the plan is correct?

    ---

    Reminder:
    This is a *textual latent*, not a solution.
    It should be cheap to generate, cheap to judge, and powerful enough that executing it once should solve the problem.

    ---

    Here is the math problem:

    {{problem}}

  plan_critic: |
    You are a plan critic for mathematical textual latents.
    Your job is to evaluate ONE plan and score how likely it is to lead to a correct solution when executed.

    You must NOT solve the problem.
    You must NOT compute anything.
    You must NOT judge style, formatting, or elegance.
    You must judge only whether this plan, if followed faithfully, is likely to reach the correct answer.

    Score range:
    - 0 = cannot possibly work
    - 10 = almost certainly leads to a correct solution

    You are evaluating *strategic correctness*, not presentation quality.

    Judge the plan on these dimensions:

    1) Conceptual Correctness (0-4 points)
    - Does the plan target the real mathematical structure of the problem?
    - Does it choose a strategy that is known to solve this type of problem?
    - Is the main idea aligned with what must actually be proven or computed?

    2) Coverage of Hard Parts (0-3 points)
    - Does the plan address the core difficulty of the problem?
    - Are the hardest steps explicitly handled rather than waved away?
    - Does it avoid skipping the real obstacle?

    3) Logical Completeness (0-2 points)
    - If all steps were executed correctly, would they logically lead to a full solution?
    - Are there missing major steps that would require inventing new ideas?

    4) Failure Risk (0-1 point)
    - Does the plan anticipate key edge cases or pitfalls that could invalidate it?
    - Does it show awareness of where the argument might break?

    Total score = sum of all components (max 10).

    Interpretation:
    - 9-10: Excellent plan. Very likely to produce a correct solution.
    - 7-8: Strong plan. Minor risks, but conceptually correct.
    - 5-6: Plausible but incomplete or fragile.
    - 3-4: Weak. Likely misses a key idea.
    - 0-2: Fundamentally flawed.

    Output format:

    First write a short justification (1-2 sentences) focusing only on:
    - why the plan should work,
    - where it is most likely to fail.

    Then output exactly one line:
    Score: X/10

    No other output is allowed after the score line.

    Problem:
    {{problem}}

    Textual Latent Plan:
    {{plan}}
