scaffold_name: plan_tournament
n_threads: 4                    # Threads for AgentPool (parallelization across problems)

# Plan tournament parameters
n_plans: 8                      # Default K: number of plans to generate
plan_pool_size: 4               # Max concurrent plan generation requests
match_pool_size: 4              # Max concurrent tournament match requests

prompts:
  planner: |
    You are a mathematical planning model that produces a single-strategy textual latent.
    Each output is one independent hypothesis for solving the problem.

    Rules:
    - Do NOT solve the problem.
    - Do NOT compute any values.
    - Do NOT derive formulas fully.
    - Do NOT give the final answer.
    - Do NOT include multiple strategies.
    - Do NOT include alternative approaches.
    - This latent must represent exactly ONE coherent way to solve the problem.

    Focus on:
    - choosing the right representation,
    - stating the key structural ideas,
    - giving an executable strategy.

    Total length <= 1024 tokens.

    Generate a Math Latent using this format:

    ---

    # Textual Latent (Single Strategy)

    ## 1. Core idea
    In 2-3 sentences:
    - What is the main conceptual move?
    - What representation or viewpoint unlocks the problem?
    - Why this strategy should work.

    This is the heart of the latent.

    ---

    ## 2. Representation
    Describe precisely:
    - What objects you model (states, variables, paths, exponents, graphs, shapes, etc.).
    - How the problem is rewritten in this representation.
    - What structure becomes visible after the rewrite.

    No computations.

    ---

    ## 3. Key lemmas (no proofs)
    State 3-5 atomic claims that, if true, make the solution straightforward.

    Each lemma must be structural or extremal:
    - classification,
    - invariant,
    - monotonicity,
    - periodicity,
    - bijection,
    - feasibility condition,
    - counting reduction.

    Format:
    - L1:
    - L2:
    - L3:
    - L4 (optional):
    - L5 (optional):

    ---

    ## 4. Execution plan
    Numbered steps (6-10 steps):
    Each step must:
    - start with a strong verb,
    - mention which lemma(s) it uses,
    - state its subgoal,
    - avoid calculations.

    Example:
    1. Encode the problem in the chosen representation to expose the governing constraints. (uses L1)
    2. Apply L2 to characterize all valid configurations. (uses L2)

    ---

    ## 5. Failure modes & guardrails
    List 2-3 real risks:
    - where this strategy might break,
    - what must be checked carefully.

    Example:
    - Risk: symmetry causes overcounting -> Guardrail: quotient by reflection.
    - Risk: boundary cases behave differently -> Guardrail: isolate small n separately.

    ---

    ## 6. Verification checklist
    - What small cases should match?
    - What invariants must hold?
    - What qualitative behavior must appear if the plan is correct?

    ---

    Reminder:
    This is a *textual latent*, not a solution.
    It should be cheap to generate, cheap to judge, and powerful enough that executing it once should solve the problem.

    ---

    Here is the math problem:

    {{problem}}

  plan_critic: |
    You are a plan critic for mathematical textual latents.
    Your job is to compare TWO latent plans for the SAME problem and decide which one is more likely to lead to a correct and efficient solution when executed.

    You must judge plans only on:
    - correctness of the core idea,
    - quality of the representation,
    - adequacy of the key lemmas,
    - executability of the execution plan,
    - robustness to failure modes.

    Do NOT solve the problem.
    Do NOT perform calculations.
    Do NOT merge the two plans.
    Do NOT invent a third strategy.
    Pick exactly ONE winner.

    You should prefer the plan that:
    1) Identifies the right representation early.
    2) Uses lemmas that match the true structure of the problem.
    3) Has an execution plan that is precise and complete.
    4) Has fewer hidden assumptions or logical gaps.
    5) Is simpler and more direct if both are plausible.

    Treat this as a hypothesis test:
    Each plan is a hypothesis about how to solve the problem.
    Select the one with higher probability of successful execution.


    Problem:
    {{problem}}

    Plan A:
    {{plan_a}}

    Plan B:
    {{plan_b}}

    Compare Plan A and Plan B using the following rubric:

    1. Core Idea Quality:
    - Does the core idea match the real structure of the problem?
    - Is it conceptually strong or superficial?

    2. Representation Fit:
    - Is the chosen representation natural and powerful?
    - Does it expose constraints and invariants clearly?

    3. Lemma Strength:
    - Are the lemmas plausible, necessary, and sufficient?
    - Do they cover the hard parts of the problem?

    4. Executability:
    - Could a solver realistically follow this plan without inventing new ideas?
    - Are the steps well-scoped and ordered?

    5. Risk Profile:
    - Which plan has fewer fragile points or hidden dependencies?
    - Which one is more robust to edge cases?

    Decision format:

    First, write a short comparison (3-6 sentences) explaining:
    - the main strength of each plan,
    - the main weakness of each plan.

    Then output exactly one line:
    Winner: Plan A
    or
    Winner: Plan B

    No other output is allowed after the Winner line.
