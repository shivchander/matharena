scaffold_name: plan_scoring
n_threads: 49                    # Threads for AgentPool (parallelization across problems)

# Plan scoring parameters
scoring_pool_size: 16            # Max concurrent scoring requests

# Must specify where to read plans from (override in model config)
plan_source_model: null

prompts:
  plan_critic: |
    Score this math problem plan from 0-10.

    Criteria (10 points total):
    - Correctness (0-3): Will this approach solve the problem?
    - Completeness (0-3): Are all steps present and executable?
    - Tools (0-2): Are the math techniques appropriate?
    - Edge cases (0-2): Does it handle potential pitfalls?

    Output ONLY: {"score": <0-10>}

    Problem:
    {{problem}}

    Plan:
    {{plan}}
