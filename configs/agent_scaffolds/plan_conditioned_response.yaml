scaffold_name: plan_conditioned_response
n_threads: 49                    # Threads for AgentPool (parallelization across problems)

# Use --n M at the runner level to generate M solutions (M separate runs)
# Each run produces ONE solution conditioned on a selected plan from upstream

# Must specify where to read scored plans from (override in model config)
plan_score_source_model: null

# Plan selection method: "argmax" (use upstream best) or "softmax" (sample from scores)
selection_method: softmax

# Temperature for softmax sampling (ignored if selection_method is argmax)
# Lower = more greedy (favors high scores), Higher = more uniform
# Typical values: 0.5 (greedy), 1.0 (balanced), 2.0 (exploratory)
selection_temperature: 1.0

# Optional: Randomly sample K plans before applying selection method
# This simulates having generated only K plans (for fair cost comparison)
# If null or >= total plans, uses all plans
# selection_sample_k: 16

prompts:
  conditioned_solver: |
    Please reason step by step, and put your final answer within \boxed{}.

    {{problem}}

    {{plan}}